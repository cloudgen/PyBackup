[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyBackup"
version = "1.0.0"
description = "PyBackup packs a folder into a dated gzip archive from a text menu or from py-backup backup."
readme = "README.md"
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
license = {text = "MIT"}
authors = [
    {name = "cloudgen", email = "wongcf22@gmail.com"}
]
keywords = ["CLI", "TUI", "backup", "restore"]

dependencies = [
    "ChronicleLogger>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/cloudgen/PyBackup"
Repository = "https://github.com/cloudgen/PyBackup"
Issues = "https://github.com/cloudgen/PyBackup/issues"

[project.scripts]
py-backup = "PyBackup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
